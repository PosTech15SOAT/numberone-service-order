name: Branch flow validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate promotion source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require develop as source branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$SOURCE_BRANCH" != "develop" || "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests to main must originate from develop."
            exit 1
          fi
