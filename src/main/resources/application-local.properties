management.statsd.metrics.export.enabled=false
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15432/service_order_db}
spring.datasource.username=${DB_USERNAME:os_local}
spring.datasource.password=${DB_PASSWORD:local-development-only}
app.branch.id=${OS_BRANCH_ID:40000000-0000-4000-8000-000000000001}
app.security.identity.provider=${IDENTITY_PROVIDER:local}
# Explicit local development identity; no JWT issuer or login endpoint.
app.security.identity.local.subject=${LOCAL_EMPLOYEE_ID:00000007-0000-4000-8000-000000000001}
app.security.identity.local.roles=ADMIN
