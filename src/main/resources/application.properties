spring.application.name=numberone-service-order
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.structured.format.console=logstash
management.statsd.metrics.export.enabled=${STATSD_ENABLED:false}
management.statsd.metrics.export.host=${DD_AGENT_HOST:localhost}
management.statsd.metrics.export.port=${DD_DOGSTATSD_PORT:8125}
management.statsd.metrics.export.flavor=datadog
management.metrics.tags.service=${DD_SERVICE:numberone-service-order}
management.metrics.tags.env=${DD_ENV:local}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration
app.branch.id=${OS_BRANCH_ID}
app.security.identity.provider=${IDENTITY_PROVIDER:gateway}
app.security.identity.gateway-trusted=${GATEWAY_HEADERS_TRUSTED:false}
management.endpoint.health.group.readiness.include=readinessState,db
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
app.billing.sqs.enabled=${BILLING_SQS_ENABLED:false}
app.billing.sqs.mode=${BILLING_SQS_MODE:disabled}
app.billing.sqs.queue-url=${BILLING_SQS_QUEUE_URL:}
app.billing.sqs.region=${AWS_REGION:us-east-1}
app.billing.sqs.endpoint=${BILLING_SQS_ENDPOINT:}
app.saga.billing-url=${BILLING_BASE_URL:}
app.saga.inventory-url=${INVENTORY_BASE_URL:}
app.saga.billing-token=${OS_TO_BILLING_TOKEN:}
app.saga.inventory-token=${OS_TO_INVENTORY_TOKEN:}
app.saga.billing-inbound-token=${BILLING_TO_OS_TOKEN:}

app.saga.recovery-enabled=${SAGA_RECOVERY_ENABLED:true}
app.saga.recovery-delay-ms=${SAGA_RECOVERY_DELAY_MS:5000}

app.history.enabled=${HISTORY_DYNAMODB_ENABLED:false}
app.history.worker-enabled=${HISTORY_WORKER_ENABLED:true}
app.history.poll-delay-ms=${HISTORY_POLL_DELAY_MS:1000}
app.history.table=${HISTORY_DYNAMODB_TABLE:}
app.history.region=${AWS_REGION:us-east-1}
app.history.endpoint=${HISTORY_DYNAMODB_ENDPOINT:}
