apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: numberone-os-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: homologation
  - target: {kind: ConfigMap, name: numberone-os-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: numberone-os-config}
      data:
        BILLING_BASE_URL: http://numberone-billing-service.numberone-billing.svc.cluster.local:8080
        INVENTORY_BASE_URL: http://numberone-inventory-service.numberone-inventory.svc.cluster.local:8080
        SPRING_TASK_SCHEDULING_POOL_SIZE: "3"
        JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
        AWS_EC2_METADATA_DISABLED: "true"
  - target: {kind: Deployment, name: numberone-os}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: numberone-os}
      spec:
        template:
          spec:
            containers:
              - name: os
                env:
                  - name: DD_ENV
                    value: homologation
