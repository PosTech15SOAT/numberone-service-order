apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: numberone-local
resources:
  - ../../base
configMapGenerator:
  - name: numberone-os-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=kind
  - name: numberone-os-runtime
    envs: [runtime.env]
images:
  - name: image.invalid/numberone-service-order
    newName: numberone-service-order
    newTag: r2-20261114
patches:
  - path: deployment-patch.yaml
