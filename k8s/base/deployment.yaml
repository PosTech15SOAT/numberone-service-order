apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-service-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: numberone-service-order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: numberone-service-order
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: os
          image: image.invalid/numberone-service-order:review-required
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: DB_URL
              valueFrom:
                secretKeyRef: {name: numberone-os-database, key: url}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: numberone-os-database, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: numberone-os-database, key: password}
            - name: OS_BRANCH_ID
              valueFrom:
                configMapKeyRef: {name: numberone-os-runtime, key: branch-id}
            - name: GATEWAY_HEADERS_TRUSTED
              value: "false"
            - name: DD_SERVICE
              value: numberone-service-order
            - name: DD_ENV
              value: production
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: STATSD_ENABLED
              value: "true"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
