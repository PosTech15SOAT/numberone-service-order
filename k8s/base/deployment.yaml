apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-service-order
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: numberone-service-order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: numberone-service-order
    spec:
      serviceAccountName: numberone-os
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: os
          image: image.invalid/numberone-service-order:review-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: numberone-os-config}
            - configMapRef: {name: numberone-os-runtime}
            - secretRef: {name: numberone-os-integrations, optional: true}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef: {name: numberone-os-database, key: url}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: numberone-os-database, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: numberone-os-database, key: password}
            - name: OS_BRANCH_ID
              valueFrom:
                configMapKeyRef: {name: numberone-os-runtime, key: branch-id}
            - name: DD_SERVICE
              value: numberone-service-order
            - name: DD_ENV
              value: production
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: STATSD_ENABLED
              value: "true"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
